[project]
name = "cadx"
version = "0.1.0"
description = "CADX Sprint 0 scaffold: Part RAG + Assembly + URDF demo"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "pyyaml>=6", "typer>=0.9"]

[project.optional-dependencies]
cad = ["build123d>=0.8"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[project.scripts]
cadx = "cadx.cli:app"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
